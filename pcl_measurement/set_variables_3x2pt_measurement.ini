[run_pipeline]
# PIPELINE_DIR set to path on local machine where SWEPT is installed
PIPELINE_DIR=/raid/scratch/wongj/mywork/3x2pt/SWEPT/

[measurement_setup]
# Parameters to set for the tomographic configuration for the PCl measurement

# Location on disk to save Pseudo-Cl power spectra in txt format
MEASUREMENT_SAVE_DIR=/raid/scratch/wongj/mywork/TEST_lcut/Measurement_FULL/
# Location on disk where mock shear catalogues/data (generated by catalogue_sim.run_cat_sim.sh) are found
CATALOGUE_DIR=/raid/scratch/wongj/mywork/TEST_lcut/Simulation_FULL/
# NSIDE used to generate maps for shear catalogue creation/measure PCl spectra
NSIDE=128
# No. realisations to average signal over (generally equal to number of catalogues created)
REALISATIONS=200
# Minimum ell to measure PCl spectra
#OUTPUT_ELL_MIN=50.0
# Maximum ell to measure PCl spectra
#OUTPUT_ELL_MAX=200.0
# Path to survey mask used for observation (needed for generating mixing matrices for PCl analysis
PATH_TO_MASK=/raid/scratch/wongj/mywork/3x2pt/Euclid_Masks/Euclid_DR1_128.fits
# No. bandpowers to bin PCl spectra into
N_BANDPOWERS=10
# Bandpower spacing. Should be 'log' for logarithmic spacing or 'lin' for linear spacing
BANDPOWER_SPACING=log
# Minimum ell used for maps to simulate catalogues in catalogue_sim.run_cat_sim.sh
INPUT_ELL_MIN=2.0
# Maximum ell used for maps to simulate catalogues in catalogue_sim.run_cat_sim.sh
INPUT_ELL_MAX=250.0
# Observation type: either '3X2PT' for a full 3x2pt analysis, or '1X2PT' for a shear-only or angular galaxy clustering-only analysis
OBS_TYPE=3X2PT

# Minimum ell to measure PCl spectra for NN
OUTPUT_ELL_MIN_NN=50.0
# Maximum ell to measure PCl spectra for NN
OUTPUT_ELL_MAX_NN=100.0
# Minimum ell to measure PCl spectra for NE
OUTPUT_ELL_MIN_NE=50.0
# Maximum ell to measure PCl spectra for NE
OUTPUT_ELL_MAX_NE=100.0
# Minimum ell to measure PCl spectra for EE
OUTPUT_ELL_MIN_EE=50.0
# Maximum ell to measure PCl spectra for EE
OUTPUT_ELL_MAX_EE=200.0

# If OBS_TYPE=1X2PT for a single component analysis, FIELD must be either 'N' for clustering, or 'E' for shear. Ignored if OBS_TYPE=3x2pt
FIELD=N
# Minimum ell to measure PCl spectra for 1x2pt. Ignored if OBS_TYPE=3x2pt. I don't think this is needed actually..
# OUTPUT_ELL_MIN=50.0
# Maximum ell to measure PCl spectra for 1x2pt. Ignored if OBS_TYPE=3x2pt. I don't think this is needed actually..
# OUTPUT_ELL_MAX=200.0

[noise_cls]
# Parameters that govern the noise components in the mock shear data

# Standard deviation quantity describing Gaussian photo-z errors (see Eq. 46 in Wong+24)
SIGMA_PHOT=0.0
# Standard deviation quantity describing Gaussian shape noise (see Eq. 48 in Wong+24)
SIGMA_SHEAR=0.0
#SIGMA_PHOT=0.05
#SIGMA_SHEAR=0.3

[run_cosmosis]
# Path to CosmoSIS installation on disk
COSMOSIS_ROOT_DIR=/raid/scratch/wongj/cosmosis/

[create_nz]
# Parameters to set tomographic binning configuration

# Minimum redshift of redshift range to consider for tomographic PCl measurement
ZMIN=0.5
# Maximum redshift of redshift range to consider for tomographic PCl measurement
ZMAX=0.7
# Redshift resolution of mock galaxy sample
DZ=0.1
# No. redshift bins to use for tomographic configuration
N_ZBIN=1
# Redshift binning type for tomographic configuration. 'EQUI_POP' for equipopulated bin, 'EQUI_Z' for equal redshift width bins, and 'EQUI_D' for bins equally spaced in fiducial comoving distance
ZBIN_TYPE=EQUI_POP
# The binning configuration parameters will be saved in a table format on disk, with the location/name: MEASUREMENT_SAVE_DIR/MEASURED_NZ_TABLE_NAME. MEASURED_NZ_TABLE_NAME does not need to be changed
MEASURED_NZ_TABLE_NAME=Observed_nz.txt

