[run_pipeline]
# PIPELINE_DIR set to path on local machine where SWEPT is installed
PIPELINE_DIR=/raid/scratch/wongj/mywork/3x2pt/SWEPT/

[measurement_setup]
# Parameters to set for the tomographic configuration for the PCl measurement
MEASUREMENT_SAVE_DIR=/raid/scratch/wongj/mywork/3x2pt/TEST_SWEPT/Measurement/  # Location on disk to save Pseudo-Cl power spectra in txt format
CATALOGUE_DIR=/raid/scratch/wongj/mywork/3x2pt/TEST_SWEPT/Simulation/          # Location on disk where mock shear catalogues/data (generated by catalogue_sim.run_cat_sim.sh) are found
NSIDE=256                                                                      # NSIDE used to generate maps for shear catalogue creation/measure PCl spectra
REALISATIONS=2                                                                 # No. realisations to average signal over (generally equal to number of catalogues created)
OUTPUT_ELL_MIN=100.0                                                           # Minimum ell to measure PCl spectra
OUTPUT_ELL_MAX=300.0                                                           # Maximum ell to measure PCl spectra
PATH_TO_MASK=/raid/scratch/wongj/mywork/3x2pt/Euclid_Masks/Euclid_DR1_256.fits  # Path to survey mask used for observation (needed for generating mixing matrices for PCl analysis
N_BANDPOWERS=10                                                                # No. bandpowers to bin PCl spectra into
BANDPOWER_SPACING=log                                                          # Bandpower spacing. Should be 'log' for logarithmic spacing or 'lin' for linear spacing
INPUT_ELL_MIN=2.0                                                              # Minimum ell used for maps to simulate catalogues in catalogue_sim.run_cat_sim.sh
INPUT_ELL_MAX=500.0                                                            # Maximum ell used for maps to simulate catalogues in catalogue_sim.run_cat_sim.sh
OBS_TYPE=3X2PT                                                                 # Observation type: either '3X2PT' for a full 3x2pt analysis, or '1X2PT' for a shear-only or angular galaxy clustering-only analysis
FIELD=N                                                                        # If OBS_TYPE=1X2PT for a single component analysis, FIELD must be either 'N' for clustering, or 'E' for shear

[noise_cls]
# Parameters that govern the noise components in the mock shear data
#SIGMA_PHOT=0.0
#SIGMA_SHEAR=0.0
SIGMA_PHOT=0.05                                                                # Standard deviation quantity describing Gaussian photo-z errors (see Eq. 46 in Wong+24)
SIGMA_SHEAR=0.3                                                                # Standard deviation quantity describing Gaussian shape noise (see Eq. 48 in Wong+24)

[run_cosmosis]
COSMOSIS_ROOT_DIR=/raid/scratch/wongj/cosmosis/                                # Path to CosmoSIS installation on disk

[create_nz]
# Parameters to set tomographic binning configuration
ZMIN=0.3                                                                        # Minimum redshift of redshift range to consider for tomographic PCl measurement                                                                        
ZMAX=2.7                                                                        # Maximum redshift of redshift range to consider for tomographic PCl measurement 
DZ=0.1                                                                          # Redshift resolution of mock galaxy sample
N_ZBIN=2                                                                        # No. redshift bins to use for tomographic configuration
ZBIN_TYPE=EQUI_POP                                                              # Redshift binning type for tomographic configuration. 'EQUI_POP' for equipopulated bin, 'EQUI_Z' for equal redshift width bins, and 'EQUI_D' for bins equally spaced in fiducial comoving distance
MEASURED_NZ_TABLE_NAME=Observed_nz.txt                                          # The binning configuration parameters will be saved in a table format on disk, with the location/name: MEASUREMENT_SAVE_DIR/MEASURED_NZ_TABLE_NAME. MEASURED_NZ_TABLE_NAME does not need to be changed

